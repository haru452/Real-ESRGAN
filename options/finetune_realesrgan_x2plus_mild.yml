# finetune_realesrgan_x2plus.yml をコピーし、劣化を EDSR / HAT と同じ弱い劣化
# (EDSR/degradation_lunar_mild.yml) にそろえたもの。
# 変えたのは「劣化」「学習画像」「val の LR」「学習の長さ」だけ。ネットワーク・損失 (L1 + perceptual + GAN)・
# 学習率・batch・gt_size は元の finetune_realesrgan_x2plus.yml のまま。
#
#   python realesrgan/train.py -opt options/finetune_realesrgan_x2plus_mild.yml
#
# 下の値は EDSR/degradation_lunar_mild.yml と 1 対 1 で同じ (元画像の測定に合わせた値)。
#   1 段目: ぼかし σ 1.0~2.2 だけ。拡大縮小・ノイズ・sinc なし
#   2 段目: 追加のぼかしなし。ちょうど 1/2 に縮小 (area / bilinear / bicubic はランダム) してから、
#           ガウス (σ 1.5~7) かポアソン (0.15~0.6) のノイズを 50% ずつ。ノイズは白黒 (3 チャンネル共通)
#   最後の sinc なし。JPEG はこのリポジトリでは model 側でコメントアウトされているので入らない

# general settings
name: finetune_RealESRGANx2plus_mild
model_type: RealESRGANMildModel   # realesrgan/models/realesrgan_mild_model.py (元の RealESRGANModel のコピー)
scale: 2
num_gpu: auto
manual_seed: 0

# ----------------- options for synthesizing training data in RealESRGANMildModel ----------------- #
# 劣化は USM をかけない元の GT から作る (EDSR の edsr_fine_tuning_realesrgan.py と同じ。公式は true 相当)
deg_from_usm: false
# 学習の正解も元の GT にそろえる (EDSR / HAT と同じ正解画像)。
# 公式どおり USM をかけた正解で学習したいときは l1_gt_usm と percep_gt_usm を True に戻す
l1_gt_usm: False
percep_gt_usm: False
gan_gt_usm: False

# the first degradation process (ぼかしだけ)
resize_prob: [0, 0, 1]  # up, down, keep: ランダムな拡大縮小はしない
resize_range: [1, 1]
gaussian_noise_prob: 1  # 1 段目のノイズは 0 (縮小後の 2 段目で入れる)
noise_range: [0, 0]
poisson_scale_range: [0, 0]
gray_noise_prob: 1
jpeg_range: [30, 95]    # 使われない (JPEG はコメントアウト済み)

# the second degradation process (1/2 に縮小してからノイズ)
second_blur_prob: 0
resize_prob2: [0, 0, 1]  # keep: ちょうど 1/scale に縮小する
resize_range2: [1, 1]
gaussian_noise_prob2: 0.5
noise_range2: [1.5, 7]   # 元画像のノイズの測定値 2.3 ~ 6.7 を少し広げた範囲
poisson_scale_range2: [0.15, 0.6]
gray_noise_prob2: 1
jpeg_range2: [30, 95]    # 使われない

gt_size: 256
queue_size: 180

# dataset and data loader settings
datasets:
  train:
    name: high6
    type: RealESRGANDataset
    # 学習画像は EDSR と同じ dataset/high6。meta_info は次のコマンドで作る:
    #   python scripts/generate_meta_info.py --input dataset/high6 --root dataset --meta_info dataset/meta_info_high6.txt
    dataroot_gt: dataset
    meta_info: dataset/meta_info_high6.txt
    io_backend:
      type: disk

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.60, 0.30, 0.05, 0.05, 0.0, 0.0]
    sinc_prob: 0
    blur_sigma: [1.0, 2.2]  # 元画像の測定値 1.3 ~ 1.8 を少し広げた範囲
    betag_range: [0.8, 2]
    betap_range: [1, 2]

    blur_kernel_size2: 21
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.60, 0.30, 0.05, 0.05, 0.0, 0.0]
    sinc_prob2: 0
    blur_sigma2: [0.2, 1.0]  # second_blur_prob: 0 なので使われない
    betag_range2: [0.8, 2]
    betap_range2: [1, 2]

    final_sinc_prob: 0

    gt_size: 256
    use_hflip: True
    use_rot: False

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 5
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: validation_bicubic
    type: PairedImageDataset
    # val の LR は EDSR と同じ bicubic 縮小。次のコマンドで作る:
    #   python scripts/generate_val_lq.py --mode bicubic --scale 2 --gt dataset/val/gt --lq dataset/val/lq_bicubic
    dataroot_gt: dataset/val/gt
    dataroot_lq: dataset/val/lq_bicubic
    io_backend:
      type: disk

# network structures
network_g:
  type: RRDBNet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_block: 23
  num_grow_ch: 32
  scale: 2      # x2用のRRDBNet構造にする

network_d:
  type: UNetDiscriminatorSN
  num_in_ch: 3
  num_feat: 64
  skip_connection: True

# path
path:
  # use the official pre-trained Real-ESRGAN x2 model
  pretrain_network_g: experiments/pretrained_models/RealESRGAN_x2plus.pth  # 公式の x2 重みから開始
  param_key_g: params_ema
  strict_load_g: true
  pretrain_network_d: experiments/pretrained_models/RealESRGAN_x2plus_netD.pth
  param_key_d: params
  strict_load_d: true
  resume_state: ~

# training settings
train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]

  scheduler:
    type: MultiStepLR
    milestones: [40000]
    gamma: 0.5

  # 学習の長さ: EDSR (30 エポック、1 エポック = high6 の枚数 N パッチ、HR 96x96) と見た画素数をそろえると
  #   total_iter ≒ 30 × N × 96² / (4 × 256²) ≒ 1.05 × N
  # 前回 (強い劣化、150k) は val が 10k 付近で最高だったので、50k で止める。N に合わせて調整してよい
  total_iter: 50000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  # perceptual loss (content and style losses)
  perceptual_opt:
    type: PerceptualLoss
    layer_weights:
      # before relu
      'conv1_2': 0.1
      'conv2_2': 0.1
      'conv3_4': 1
      'conv4_4': 1
      'conv5_4': 1
    vgg_type: vgg19
    use_input_norm: true
    perceptual_weight: !!float 1.0
    style_weight: 0
    range_norm: false
    criterion: l1
  # gan loss
  gan_opt:
    type: GANLoss
    gan_type: vanilla
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: !!float 1e-1

  net_d_iters: 1
  net_d_init_iters: 0

# validation settings
val:
  val_freq: !!float 5e3
  save_img: False

  metrics:
    psnr: # metric name
      type: calculate_psnr
      crop_border: 2
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
